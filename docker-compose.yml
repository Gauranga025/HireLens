services:
  postgres:
    image: postgres:16
    container_name: resume-parser-db
    environment:
      POSTGRES_DB: resume_screening
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_screening"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
